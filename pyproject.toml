[project]
name = "type-survivors-cli"
version = "0.1.0"
description = "Type Survivors: a typing-survivors terminal game (Textual)."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.1",
    "textual==8.2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsurv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py313"
# Legacy asset-generator scripts at repo root predate the strict gates and are
# out of scope (frozen at 689311c); only new game/test code is linted.
exclude = ["gen_sprites.py", "sprites.py"]

[tool.ruff.lint]
select = ["ALL"]
# No copyright-header convention in this project (rule needs per-author config).
ignore = ["CPY001"]

[tool.ruff.lint.per-file-ignores]
# Plain asserts are the pytest mechanism (per ruff docs recommendation).
"tests/**" = ["S101"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.13"
# Legacy asset-generator scripts at repo root predate the strict gates and are
# out of scope (frozen at 689311c); only the game package is type-checked.
include = ["src", "tests"]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.2",
]
