[project]
name = "type-survivors-cli"
version = "0.1.1"
description = "Type Survivors: a typing-survivors terminal game (Textual)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shreyas S Joshi" }]
keywords = ["game", "typing", "terminal", "textual", "survivors"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]
requires-python = ">=3.13"
dependencies = [
    "par-textual-image>=0.1.0",
    "pillow>=11.0",
    "platformdirs>=4.0",
    "pydantic>=2.14.1",
    "pygame-ce>=2.5.8",
    "rich-pixels>=3.0.1",
    "terminaltexteffects>=0.15.0",
    "textual==8.2.8",
]

[project.scripts]
type-survivors = "tsurv.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsurv"]
# Unused art: Kenney reference pack + blood-decal PNGs (floor splats render as
# text). Kept in the repo/sdist, shipped out of the wheel to save ~1M.
exclude = [
    "src/tsurv/assets/tiny-creatures/**",
    "src/tsurv/assets/decals/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py313"
# Legacy asset-generator scripts at repo root predate the strict gates and are
# out of scope (frozen at 689311c); only new game/test code is linted.
exclude = ["gen_sprites.py", "sprites.py", "typings"]

[tool.ruff.lint]
select = ["ALL"]
# No copyright-header convention in this project (rule needs per-author config).
ignore = ["CPY001"]

[tool.ruff.lint.per-file-ignores]
# Plain asserts are the pytest mechanism (per ruff docs recommendation).
"tests/**" = ["S101"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.13"
# Legacy asset-generator scripts at repo root predate the strict gates and are
# out of scope (frozen at 689311c); only the game package is type-checked.
include = ["src", "tests"]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.2",
]
